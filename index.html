<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HydroLog</title><link rel="stylesheet" href="style.css">
<style>
body{background:#f8faf4}
.hero{position:relative;overflow:hidden;padding:30px 0 14px}
.hero::before{content:"";position:absolute;right:-140px;top:-90px;width:560px;height:320px;background:#e3efdc;border-radius:55% 45% 30% 70%/60% 35% 65% 40%}
.hero>*{position:relative}.hero .pt{position:absolute;right:6px;top:-4px;width:200px;height:auto}
.sp{position:absolute!important;left:0;top:22px;width:34px;height:34px}
.hero h1{margin:0 0 4px 46px;font-size:1.3rem;font-weight:600;color:var(--pri)}
.hl{position:relative;display:inline-block;font:italic 800 clamp(2.3rem,8vw,3.6rem)/1.15 system-ui,sans-serif;color:var(--pri)}
.hl svg{position:absolute;left:0;bottom:-2px;width:100%;height:12px}
.hero p.q{margin:10px 0 0 46px;color:var(--mut)}
.chips{display:flex;flex-wrap:wrap;gap:12px;margin:22px 0}
.chip{margin:0;display:flex;gap:8px;align-items:center;background:#fff;color:var(--pri);padding:10px 20px;border-radius:99px;box-shadow:0 1px 5px rgba(23,61,42,.12)}
.chip.on{background:var(--pri);color:#fff}
.sh{display:flex;align-items:center;gap:8px;font-size:1.2rem;margin:26px 0 6px}
.sl{--g:14px;--w:calc((100% - 2 * var(--g)) / 3);overflow:hidden;max-width:900px;margin:0 auto;padding:14px 0}
.tr{display:flex;gap:var(--g);position:relative;transition:transform .8s ease}
.tr figure{flex:0 0 var(--w);margin:0;background:#fff;border-radius:14px;overflow:hidden;cursor:pointer;box-shadow:0 2px 8px rgba(23,61,42,.18);transform:scale(.82);filter:blur(4px);opacity:.75;transition:transform .8s ease,filter .8s ease,opacity .8s ease}
.tr figure.c{transform:none;filter:none;opacity:1}
.tr.nt,.tr.nt figure{transition:none}
.tr img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block}
figcaption{display:flex;align-items:center;gap:10px;padding:10px 12px}
figcaption div{flex:1;min-width:0}figcaption b{display:block;font-size:.95rem}figcaption small{color:var(--mut)}
.ar{width:30px;height:30px;border-radius:50%;background:#e8efe3;display:grid;place-items:center;color:var(--pri);font-weight:700}
.dots{text-align:center}.dots button{width:12px;height:12px;padding:0;margin:0 4px;border-radius:50%;background:var(--off)}.dots button.on{background:var(--pri)}
@media(max-width:560px){.hero .pt{width:110px}.hl{font-size:2.3rem}figcaption{padding:6px 8px}.ar{display:none}}
@media(prefers-reduced-motion:reduce){.tr,.tr figure{transition:none}}
</style></head>
<body><main>
<section class="hero">
<svg class="sp" viewBox="0 0 34 34" aria-hidden="true"><g stroke="#f2c744" stroke-width="3" stroke-linecap="round"><path d="M6 10 L14 14"/><path d="M12 3 L16 10"/><path d="M4 20 L12 20"/></g></svg>
<svg class="pt" viewBox="0 0 220 200" aria-hidden="true"><path d="M110 200C108 150 112 120 110 90" stroke="#3f7a4a" stroke-width="6" fill="none" stroke-linecap="round"/><path d="M110 100C70 100 40 80 30 40C70 40 105 60 110 100Z" fill="#6aa56e"/><path d="M112 90C120 50 150 20 190 18C195 60 160 95 112 90Z" fill="#8bc58a"/><path d="M110 130C85 135 60 125 45 105C75 100 100 108 110 130Z" fill="#4f8f58"/><path d="M114 125C135 110 160 108 180 118C165 140 135 142 114 125Z" fill="#a8d5a2"/></svg>
<h1>Hallo, selamat datang di</h1>
<span class="hl" style="margin-left:46px">HydroLog!<svg viewBox="0 0 220 12" preserveAspectRatio="none" aria-hidden="true"><path d="M2 8Q55 2 110 6T218 5" stroke="#f2c744" stroke-width="4" fill="none" stroke-linecap="round"/></svg></span>
<p class="q">Mau menanam apa hari ini?</p></section>
<div class="chips" role="group" aria-label="Pilih tanaman">
<button class="chip" type="button" data-t="Pakcoy">🥬 Pakcoy</button><button class="chip" type="button" data-t="Selada">🥗 Selada</button><button class="chip" type="button" data-t="Bayam">🍃 Bayam</button><button class="chip" type="button" data-t="Kangkung">🌱 Kangkung</button><button class="chip" type="button" data-t="">⋯ Tanaman lain</button></div>
<p><a id="mulai" class="b" href="setup.html">＋ Mulai kebun baru</a> <a id="lanjut" class="b l" href="dashboard.html">📄 Lanjutkan pemantauan</a></p>
<p class="m">Data tersimpan di browser perangkat ini. Unduh CSV secara rutin sebagai cadangan.</p>
<section id="gal" hidden><h2 class="sh">🌱 Perkembangan Tanaman</h2>
<div class="sl" id="sl"><div class="tr" id="tr"></div></div>
<div class="dots" id="dt"></div></section></main>
<script src="app.js"></script>
<script>
if(!load().garden)$('lanjut').className='b l off';
(function(){var ch=document.querySelectorAll('.chip');
function pilih(t){[].forEach.call(ch,function(c){var on=c.dataset.t===t;c.classList.toggle('on',on);c.setAttribute('aria-pressed',on)});$('mulai').href='setup.html'+(t?'?t='+encodeURIComponent(t):'')}
[].forEach.call(ch,function(c){c.onclick=function(){pilih(c.dataset.t)}});pilih('Pakcoy')})();
(function(){var MAX=40,list=[],n=0,i=0,timer=null,tr=$('tr'),sl=$('sl'),dt=$('dt');
function lb(k){return k===1?'Pasca semai':'Minggu '+(k-1)}
function cek(k){if(k>MAX)return mulai();var im=new Image();im.onload=function(){list.push(k);cek(k+1)};im.onerror=mulai;im.src='Gambar'+k+'.jpg'}
function pos(anim){var f=tr.children[i];if(!f)return;tr.classList.toggle('nt',!anim);tr.style.transform='translateX('+(sl.clientWidth/2-(f.offsetLeft+f.offsetWidth/2))+'px)'}
function info(){[].forEach.call(tr.children,function(f,j){f.className=j===i?'c':''});var r=n>1?(i-1+n)%n:0;[].forEach.call(dt.children,function(b,j){b.className=j===r?'on':''})}
function go(k){i=k;pos(true);info()}
function play(){stop();if(n>1&&!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(function(){go(i+1)},3500)}
function stop(){clearInterval(timer)}
function snap(k){i=k;pos(false);info();tr.offsetWidth;tr.classList.remove('nt')}
function mulai(){n=list.length;if(!n)return;$('gal').hidden=false;
 var arr=n>1?[list[n-1]].concat(list,[list[0],list[1%n]]):list;i=n>1?1:0;
 tr.innerHTML=arr.map(function(k){return'<figure><img src="Gambar'+k+'.jpg" alt="'+lb(k)+'"><figcaption><div><b>'+lb(k)+'</b><small>Foto ke-'+k+'</small></div><span class="ar">›</span></figcaption></figure>'}).join('');
 tr.addEventListener('transitionend',function(e){if(e.target!==tr)return;if(i>n)snap(1);else if(i<1)snap(n)});
 tr.onclick=function(e){var f=e.target.closest('figure');if(f&&n>1){go([].indexOf.call(tr.children,f));play()}};
 addEventListener('resize',function(){pos(false)});
 if(n>1){dt.innerHTML=list.map(function(k,j){return'<button type="button" aria-label="'+lb(k)+'" data-j="'+j+'"></button>'}).join('');
  dt.onclick=function(e){var j=e.target.dataset.j;if(j!=null){go(+j+1);play()}};
  var g=$('gal');g.onmouseenter=stop;g.onmouseleave=play;g.ontouchstart=stop;g.ontouchend=play}
 pos(false);info();tr.offsetWidth;tr.classList.remove('nt');play()}
cek(1)})();
</script></body></html>
